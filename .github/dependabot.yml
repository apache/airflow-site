---
version: 2
updates:
  - package-ecosystem: npm
    cooldown:
      default-days: 7
    directories:
      - /landing-pages
    schedule:
      interval: daily
    groups:
      npm-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: github-actions
    cooldown:
      default-days: 7
    directory: /
    schedule:
      interval: daily
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: pre-commit
    cooldown:
      default-days: 7
    directory: /
    schedule:
      interval: weekly
    groups:
      pre-commit-hooks:
        patterns:
          - "*"
