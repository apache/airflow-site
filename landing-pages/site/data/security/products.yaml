# How the /security/ pages group the CVE records in cves/.
#
# Each `affected` entry of a record is assigned to one product listing:
#   1. its `packageName` (anything after the package name itself is ignored);
#   2. or, when the record has no `packageName`, the package that `aliases`
#      maps its `product` name to (older records only carry a product name);
#   3. the listing whose `packages` contains that package, or `providers` for any
#      `apache-airflow-providers-*` package, or the listing whose `names`
#      contains the product name;
#   4. anything else lands in the "Other" listing, so a record with a new product
#      name still shows up; add an alias or a listing here to place it.
# A listing page is only generated once at least one CVE belongs to it.
products:
  - key: apache-airflow
    title: Apache Airflow
    packages: [apache-airflow, apache-airflow-core]
  - key: providers
    title: Apache Airflow Providers
    package_prefix: apache-airflow-providers-
  - key: task-sdk
    title: Apache Airflow Task SDK
    packages: [apache-airflow-task-sdk]
  - key: airflowctl
    title: Apache Airflow CTL (airflowctl)
    packages: [apache-airflow-ctl]
  - key: python-client
    title: Apache Airflow Python Client
    packages: [apache-airflow-client]
  - key: helm-chart
    title: Apache Airflow Helm Chart
    names: [Apache Airflow Helm Chart, Helm Chart for Apache Airflow]
  - key: other
    title: Other

# Product name (as written in records without `packageName`) -> PyPI package.
aliases:
  Airflow: apache-airflow
  Apache Airflow: apache-airflow
  Apache Airflow AWS Provider: apache-airflow-providers-amazon
  Apache Airflow Apache Hive Provider: apache-airflow-providers-apache-hive
  Apache Airflow CNCF Kubernetes Provider: apache-airflow-providers-cncf-kubernetes
  Apache Airflow Drill Provider: apache-airflow-providers-apache-drill
  Apache Airflow FTP Provider: apache-airflow-providers-ftp
  Apache Airflow Google Provider: apache-airflow-providers-google
  Apache Airflow Google provider: apache-airflow-providers-google
  Apache Airflow HDFS Provider: apache-airflow-providers-apache-hdfs
  Apache Airflow Hive Provider: apache-airflow-providers-apache-hive
  Apache Airflow IMAP Provider: apache-airflow-providers-imap
  Apache Airflow JDBC Provider: apache-airflow-providers-jdbc
  Apache Airflow MSSQL Provider: apache-airflow-providers-microsoft-mssql
  Apache Airflow Mongo Provider: apache-airflow-providers-mongo
  Apache Airflow MySQL Provider: apache-airflow-providers-mysql
  Apache Airflow ODBC Provider: apache-airflow-providers-odbc
  Apache Airflow Pinot Provider: apache-airflow-providers-apache-pinot
  Apache Airflow SMTP Provider: apache-airflow-providers-smtp
  Apache Airflow Spark Provider: apache-airflow-providers-apache-spark
  Apache Airflow Sqoop Provider: apache-airflow-providers-apache-sqoop
  Apache Airlfow Pig Provider: apache-airflow-providers-apache-pig
